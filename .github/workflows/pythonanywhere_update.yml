name: Trigger PythonAnywhere Update

on:
  push:
    branches:
      - main

jobs:
  run_update_task:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install requests
        run: pip install requests

      - name: Update PythonAnywhere scheduled task
        env:
          PA_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python - <<'EOF'
          import requests
          from datetime import datetime, timedelta

          username = '${{ secrets.PYTHONANYWHERE_USERNAME }}'
          token = '${{ secrets.PYTHONANYWHERE_API_TOKEN }}'
          headers = {"Authorization": f"Token {token}"}

          # Schedule the task to run 1 minute from now (UTC)
          now = datetime.utcnow()
          next_minute = now + timedelta(minutes=1)
          hour = next_minute.hour
          minute = next_minute.minute

          # Data for the scheduled task
          data = {
              "command": "bash /home/GuySchnidrig/update_project.sh",
              "enabled": True,
              "description": "Auto-update ManaDash project from GitHub",
              "interval": "daily",
              "hour": hour,
              "minute": minute
          }

          # Your task ID on PythonAnywhere
          task_id = 1337378

          r = requests.put(
              f"https://www.pythonanywhere.com/api/v0/user/{username}/schedule/{task_id}/",
              headers=headers,
              json=data
          )

          print("Status:", r.status_code)
          print("Response:", r.text)
          EOF
