name: Render and Deploy ManaDash

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync
      
      - name: Refresh card metadata
        run: uv run python -m src.backend.card_images

      - name: Render Quarto site
        run: uv run quarto render website
      
      - name: Inspect render output
        run: |
          ls -la website/_quarto.yml || echo "NO _quarto.yml ON RUNNER"
          grep -c "quarto-dashboard" website/_site/index.html || echo "NOT A DASHBOARD"
          grep -o 'href="[^"]*\.css"' website/_site/index.html | head || true
          ls website/_site | head -20
          ls website/_site/site_libs 2>/dev/null | head
          git ls-files website/
          git check-ignore -v website/_quarto.yml || echo "not ignored"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4